<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- finfra 제품 아이콘 — fCapture (macOS 스크린 캡처 CLI)
       구성: 좌측 Γ 형 F 마크 + 네 모서리 크롭 마크 + 큰 카메라 + infra 워드마크 + 우하단 고양이
       ⚠️ 노란 번개 금지 — prj15 fSnippet·fSnippetCli 의 지배 요소라 같은 액센트를 쓰면
          그 계열의 세 번째 변종으로 읽힌다 (2026-09-09 사용자 지시)
       ⚠️ 중괄호 {} · 점선 선택 사각형 제거 — 카메라를 키우기 위해 (2026-09-09 사용자 지시)
       동물은 **고양이**다. 여우가 아니다 — 눈 2개·검은 코·수염이 보여야 한다.
       원본은 fBanner/app-icon.png 에서 추출(배경이 가장 깨끗) → cat-element.png
       고양이 배치는 06.work 라이브러리의 형제 아이콘 실측 평균을 따른다 —
         중심 (773, 702) · 폭 320 · 우여백 89
         (fBanner 748/748/136 · fBoard 770/694/96 · fQRGen 802/668/52 · fWarrange 774/730/72)
       ⚠️ 우여백 0 금지 — 모서리에 붙으면 잘린 것처럼 보인다(2026-09-09 실측 교정) -->
  <defs>
    <linearGradient id="fmark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#7a5980"/>
      <stop offset="0.35" stop-color="#664364"/>
      <stop offset="1"    stop-color="#3f2140"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c3660"/>
      <stop offset="1" stop-color="#3f2140"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="#ffffff"/>

  <!-- 좌측 Γ 형 F 마크 -->
  <path d="M 219 118 L 864 118 L 855 208 L 305 208 L 244 916 L 155 916 Z"
        fill="url(#fmark)" stroke="url(#fmark)" stroke-width="10" stroke-linejoin="round"/>

  <!-- 네 모서리 크롭 마크 — 캡처 영역을 지시하는 프레임 -->
  <g fill="none" stroke="#482948" stroke-width="26" stroke-linecap="square">
    <path d="M 336 322 L 336 232 L 426 232"/>
    <path d="M 724 232 L 814 232 L 814 322"/>
    <path d="M 336 530 L 336 620 L 426 620"/>
    <path d="M 724 620 L 814 620 L 814 530"/>
  </g>

  <!-- 카메라 (주 글리프) -->
  <g>
    <!-- 뷰파인더 돌출부 -->
    <rect x="452" y="288" width="128" height="52" rx="17" fill="url(#body)"/>
    <!-- 바디 -->
    <rect x="400" y="332" width="350" height="248" rx="40" fill="url(#body)"/>
    <!-- 렌즈 -->
    <circle cx="575" cy="458" r="87" fill="#ffffff"/>
    <circle cx="575" cy="458" r="61" fill="#8f6b92"/>
    <circle cx="575" cy="458" r="30" fill="#2e1730"/>
    <circle cx="552" cy="436" r="12" fill="#ffffff" opacity="0.9"/>
    <!-- 셔터 액센트 -->
    <circle cx="697" cy="386" r="24" fill="#e8b64a"/>
  </g>

  <!-- 하단 infra 워드마크 -->
  <text x="328" y="918" font-family="Helvetica, Arial, sans-serif" font-size="224"
        font-weight="700" letter-spacing="-6" fill="#3c1b39">infra</text>
</svg>
