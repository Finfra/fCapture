<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- finfra 제품 아이콘 — fCapture (macOS 스크린 캡처 CLI)
       구성: 좌측 Γ 형 F 마크 + 네 모서리 크롭 마크 + 큰 카메라 + infra 워드마크 + 우하단 고양이
       ⚠️ 노란 번개 금지 — prj15 fSnippet·fSnippetCli 의 지배 요소라 같은 액센트를 쓰면
          그 계열의 세 번째 변종으로 읽힌다 (2026-09-09 사용자 지시)
       ⚠️ 중괄호 {} · 점선 선택 사각형 제거 — 카메라를 키우기 위해 (2026-09-09 사용자 지시)
       동물은 **고양이**다. 여우가 아니다 — 눈 2개·검은 코·수염이 보여야 한다.
       원본은 fBanner/app-icon.png 에서 추출(배경이 가장 깨끗) → cat-element.png -->
  <defs>
    <linearGradient id="fmark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#7a5980"/>
      <stop offset="0.35" stop-color="#664364"/>
      <stop offset="1"    stop-color="#3f2140"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c3660"/>
      <stop offset="1" stop-color="#3f2140"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="#ffffff"/>

  <!-- 좌측 Γ 형 F 마크 -->
  <path d="M 219 118 L 864 118 L 855 208 L 305 208 L 244 916 L 155 916 Z"
        fill="url(#fmark)" stroke="url(#fmark)" stroke-width="10" stroke-linejoin="round"/>

  <!-- 네 모서리 크롭 마크 — 캡처 영역을 지시하는 프레임 -->
  <g fill="none" stroke="#482948" stroke-width="26" stroke-linecap="square">
    <path d="M 336 380 L 336 290 L 426 290"/>
    <path d="M 724 290 L 814 290 L 814 380"/>
    <path d="M 336 630 L 336 720 L 426 720"/>
    <path d="M 724 720 L 814 720 L 814 630"/>
  </g>

  <!-- 카메라 (주 글리프) -->
  <g>
    <!-- 뷰파인더 돌출부 -->
    <rect x="452" y="352" width="128" height="54" rx="17" fill="url(#body)"/>
    <!-- 바디 -->
    <rect x="400" y="398" width="350" height="262" rx="42" fill="url(#body)"/>
    <!-- 렌즈 -->
    <circle cx="575" cy="530" r="92" fill="#ffffff"/>
    <circle cx="575" cy="530" r="65" fill="#8f6b92"/>
    <circle cx="575" cy="530" r="32" fill="#2e1730"/>
    <circle cx="551" cy="506" r="13" fill="#ffffff" opacity="0.9"/>
    <!-- 셔터 액센트 -->
    <circle cx="697" cy="452" r="25" fill="#e8b64a"/>
  </g>

  <!-- 하단 infra 워드마크 -->
  <text x="328" y="918" font-family="Helvetica, Arial, sans-serif" font-size="224"
        font-weight="700" letter-spacing="-6" fill="#3c1b39">infra</text>
</svg>
